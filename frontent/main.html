<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App Test Page</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            align-items: flex-start;
        }

        .test-shell {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
        }

        .test-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .test-panel {
            background: var(--card-bg);
            border: 1px solid var(--divider);
            border-radius: 8px;
            padding: 20px;
        }

        .test-panel h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .query-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .song-list {
            display: grid;
            gap: 12px;
        }

        .song-row {
            display: grid;
            grid-template-columns: 72px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--divider);
            border-radius: 6px;
        }

        .song-row img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 4px;
            background: var(--divider);
        }

        .song-title {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .song-meta,
        .status-line {
            color: var(--muted);
            font-size: 14px;
        }

        .small-btn {
            padding: 10px 14px;
            border: 0;
            border-radius: 24px;
            background: var(--green);
            color: #000;
            font-weight: 700;
            cursor: pointer;
        }

        .small-btn.secondary {
            background: transparent;
            color: var(--white);
            border: 1px solid var(--input-border);
        }

        .logout-link {
            color: var(--white);
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .test-grid,
            .query-grid {
                grid-template-columns: 1fr;
            }

            .song-row {
                grid-template-columns: 56px 1fr;
            }

            .song-row img {
                width: 56px;
                height: 56px;
            }

            .song-row button {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body>
    <main class="test-shell">
        <header class="test-header">
            <div>
                <span class="logo" style="font-size: 34px; margin-bottom: 8px;">&#9835;</span>
                <h1 style="font-size: 28px; margin-bottom: 6px;">Music App Test Page</h1>
                <p class="status-line">Signed in as <strong id="user-name"></strong></p>
            </div>
            <button class="small-btn secondary" id="logout-btn" type="button">Logout</button>
        </header>

        <section class="test-grid">
            <div class="test-panel">
                <h2>Subscriptions</h2>
                <p class="status-line" id="subscription-status">Loading subscriptions...</p>
                <div class="song-list" id="subscription-list"></div>
            </div>

            <div class="test-panel">
                <h2>Query</h2>
                <div class="alert alert-error" id="query-error">No result is retrieved. Please query again</div>
                <form id="query-form">
                    <div class="query-grid">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title">
                        </div>
                        <div class="form-group">
                            <label for="year">Year</label>
                            <input type="text" id="year">
                        </div>
                        <div class="form-group">
                            <label for="artist">Artist</label>
                            <input type="text" id="artist">
                        </div>
                        <div class="form-group">
                            <label for="album">Album</label>
                            <input type="text" id="album">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Query</button>
                </form>
                <p class="status-line" id="query-status" style="margin-top: 16px;"></p>
                <div class="song-list" id="query-results" style="margin-top: 12px;"></div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script>
        const email = sessionStorage.getItem('email');
        const userName = sessionStorage.getItem('user_name');

        if (!email) {
            window.location.href = 'login.html';
        }

        document.getElementById('user-name').textContent = userName || email;
        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = 'login.html';
        });

        const subscriptionList = document.getElementById('subscription-list');
        const subscriptionStatus = document.getElementById('subscription-status');
        const queryResults = document.getElementById('query-results');
        const queryStatus = document.getElementById('query-status');
        const queryError = document.getElementById('query-error');

        async function requestJson(url, options) {
            const response = await fetch(url, options);
            const text = await response.text();
            const data = text ? JSON.parse(text) : null;
            if (!response.ok) {
                throw new Error(data?.message || data?.error || `Request failed: ${response.status}`);
            }
            return data;
        }

        function songImage(song) {
            return song.image_url
                ? `<img src="${song.image_url}" alt="">`
                : `<img alt="">`;
        }

        function renderSong(song, buttonLabel, onClick) {
            const row = document.createElement('div');
            row.className = 'song-row';
            row.innerHTML = `
                ${songImage(song)}
                <div>
                    <div class="song-title"></div>
                    <div class="song-meta"></div>
                </div>
                <button class="small-btn" type="button"></button>
            `;

            row.querySelector('.song-title').textContent = song.title || '(untitled)';
            row.querySelector('.song-meta').textContent = `${song.artist || ''} ${song.year ? '- ' + song.year : ''} ${song.album ? '- ' + song.album : ''}`;
            const button = row.querySelector('button');
            button.textContent = buttonLabel;
            button.addEventListener('click', () => onClick(song));
            return row;
        }

        async function loadSubscriptions() {
            subscriptionList.innerHTML = '';
            subscriptionStatus.textContent = 'Loading subscriptions...';

            try {
                const items = await requestJson(`${BACKEND_URL}/subscriptions/${encodeURIComponent(email)}`);
                if (!items.length) {
                    subscriptionStatus.textContent = 'No subscriptions yet.';
                    return;
                }

                subscriptionStatus.textContent = '';
                items.forEach((song) => {
                    subscriptionList.appendChild(renderSong(song, 'Remove', removeSubscription));
                });
            } catch (err) {
                subscriptionStatus.textContent = err.message;
            }
        }

        async function removeSubscription(song) {
            const id = song.subscription_id || `${song.artist}#${song.title}`;
            await requestJson(`${BACKEND_URL}/subscriptions/${encodeURIComponent(email)}/${encodeURIComponent(id)}`, {
                method: 'DELETE'
            });
            loadSubscriptions();
        }

        async function subscribe(song) {
            await requestJson(`${BACKEND_URL}/subscriptions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email,
                    title: song.title,
                    artist: song.artist,
                    year: song.year,
                    album: song.album
                })
            });
            loadSubscriptions();
        }

        document.getElementById('query-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            queryError.style.display = 'none';
            queryResults.innerHTML = '';
            queryStatus.textContent = '';

            const params = new URLSearchParams();
            ['title', 'year', 'artist', 'album'].forEach((id) => {
                const value = document.getElementById(id).value.trim();
                if (value) params.set(id, value);
            });

            if (!params.toString()) {
                queryError.textContent = 'At least one field must be completed.';
                queryError.style.display = 'block';
                return;
            }

            try {
                queryStatus.textContent = 'Querying...';
                const songs = await requestJson(`${BACKEND_URL}/music?${params.toString()}`);
                if (!songs.length) {
                    queryStatus.textContent = '';
                    queryError.textContent = 'No result is retrieved. Please query again';
                    queryError.style.display = 'block';
                    return;
                }

                queryStatus.textContent = `${songs.length} result(s)`;
                songs.forEach((song) => {
                    queryResults.appendChild(renderSong(song, 'Subscribe', subscribe));
                });
            } catch (err) {
                queryStatus.textContent = err.message;
            }
        });

        loadSubscriptions();
    </script>
</body>
</html>
