<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App Test Page</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-page">
    <main class="app-shell">
        <header class="app-header">
            <div>
                <span class="logo app-logo">&#9835;</span>
                <h1 class="app-title">Music App Test Page</h1>
                <p class="status-line">Signed in as <strong id="user-name"></strong></p>
            </div>

            <button class="small-btn secondary" id="logout-btn" type="button">Logout</button>
        </header>

        <section class="app-grid">
            <section class="panel" aria-labelledby="subscriptions-heading">
                <h2 class="panel-title" id="subscriptions-heading">Subscriptions</h2>
                <p class="status-line" id="subscription-status">Loading subscriptions...</p>
                <div class="song-list" id="subscription-list"></div>
            </section>

            <section class="panel" aria-labelledby="query-heading">
                <h2 class="panel-title" id="query-heading">Query</h2>
                <div class="alert alert-error" id="query-error">No result is retrieved. Please query again</div>

                <form id="query-form">
                    <div class="query-grid">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input type="text" id="title">
                        </div>

                        <div class="form-group">
                            <label for="year">Year</label>
                            <input type="text" id="year">
                        </div>

                        <div class="form-group">
                            <label for="artist">Artist</label>
                            <input type="text" id="artist">
                        </div>

                        <div class="form-group">
                            <label for="album">Album</label>
                            <input type="text" id="album">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Query</button>
                </form>

                <p class="status-line with-offset" id="query-status"></p>
                <div class="song-list with-offset" id="query-results"></div>
            </section>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
